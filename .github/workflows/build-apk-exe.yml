# =============================================================================
# BRICKPOP NOVA ULTIMATE — Automated Offline Android APK & Portable Windows EXE
# Copyright (c) 2026 Yasin Ullah — Bannu Software Solutions
# Dedicated to little Muhib Ullah
#
# Runs on every push: builds a signed, 100% offline, immersive-fullscreen APK
# and a portable, standalone, 100% offline fullscreen Windows EXE, then
# publishes both to a rolling GitHub Release ("Latest Build").
#
# Nothing is built on your PC — all CPU, disk and SDK downloads happen on
# GitHub's cloud runners.
#
# Downloads after a successful run:
#   Releases  -> https://github.com/yasinULLAH/BricksPopGame/releases/latest
#   Artifacts -> Actions -> this workflow run -> Artifacts
# =============================================================================

name: Build Offline APK & Portable EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

# A newer commit cancels a build that is still running for the same branch.
concurrency:
  group: brickpop-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  APP_ID: com.yasinullah.brickpopnova
  # 4.0.<run number> -> every build is a newer version than the previous one,
  # so the APK installs over the old one and keeps all saved progress.
  APP_VERSION: "4.0.${{ github.run_number }}"
  APP_VERSION_CODE: ${{ github.run_number }}

jobs:
  # ===========================================================================
  # JOB 1 — ANDROID APK (CAPACITOR 8 + GRADLE, SIGNED RELEASE BUILD)
  # ===========================================================================
  android-apk:
    name: Android APK (offline · fullscreen · signed)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # v4 is required: Google removed the legacy "tools" package, which v3
      # still tries to install ("Failed to find package 'tools'" -> exit 1).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # platform-tools is installed by the next step; skip the extra pass.
          packages: ""

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-linux-${{ hashFiles('.github/build/android/package.json') }}
          restore-keys: npm-linux-

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble the offline web bundle
        run: node .github/build/scripts/prepare-web.mjs build-android/www

      - name: Create Capacitor project
        run: |
          cp .github/build/android/package.json .github/build/android/capacitor.config.json build-android/
          cd build-android
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Generate Android launcher icons from logo-master.png
        working-directory: build-android
        run: |
          node ../.github/build/scripts/generate-icons.mjs \
            --logo ../logo-master.png \
            --android-res android/app/src/main/res

      - name: Patch Android project (fullscreen · no internet · dark splash · version)
        working-directory: build-android
        run: node ../.github/build/scripts/patch-android.mjs android

      - name: Build signed release APK
        working-directory: build-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          bash ../../.github/build/scripts/sign-android-apk.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            ../../BrickPop-Nova-Ultimate.apk

      - name: Show APK details
        run: |
          ls -lh BrickPop-Nova-Ultimate.apk
          echo "### 📱 Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`$APP_VERSION\` (\`$APP_VERSION_CODE\`) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | $(du -h BrickPop-Nova-Ultimate.apk | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | \`$APP_ID\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrickPop-Nova-Ultimate-Android-APK
          path: BrickPop-Nova-Ultimate.apk
          if-no-files-found: error
          retention-days: 90

  # ===========================================================================
  # JOB 2 — PORTABLE WINDOWS EXE (ELECTRON, SINGLE-FILE, NO INSTALLER)
  # ===========================================================================
  windows-exe:
    name: Windows EXE (portable · offline · fullscreen)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-windows-${{ hashFiles('.github/build/windows/package.json') }}
          restore-keys: npm-windows-

      - name: Assemble the offline web bundle
        run: node .github/build/scripts/prepare-web.mjs build-win/www

      - name: Create Electron project
        shell: bash
        run: |
          cp .github/build/windows/package.json .github/build/windows/main.js build-win/
          cd build-win
          npm install --no-audit --no-fund

      - name: Generate Windows EXE icon from logo-master.png
        working-directory: build-win
        run: |
          node ../.github/build/scripts/generate-icons.mjs \
            --logo ../logo-master.png \
            --png build/icon.png

      - name: Stamp version into package.json
        working-directory: build-win
        run: node ../.github/build/scripts/set-version.mjs package.json "$APP_VERSION"

      - name: Build portable EXE
        working-directory: build-win
        run: npm run dist

      - name: Show EXE details
        shell: bash
        working-directory: build-win
        run: |
          ls -lh dist/BrickPop-Nova-Ultimate-Portable.exe
          echo "### 💻 Windows Portable EXE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`$APP_VERSION\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | $(du -h dist/BrickPop-Nova-Ultimate-Portable.exe | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrickPop-Nova-Ultimate-Windows-EXE
          path: build-win/dist/BrickPop-Nova-Ultimate-Portable.exe
          if-no-files-found: error
          retention-days: 90

  # ===========================================================================
  # JOB 3 — PUBLISH BOTH FILES TO THE ROLLING "LATEST BUILD" RELEASE
  # ===========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [android-apk, windows-exe]
    runs-on: ubuntu-latest

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: BrickPop-Nova-Ultimate-Android-APK
          path: release

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: BrickPop-Nova-Ultimate-Windows-EXE
          path: release

      - name: Generate SHA-256 checksums
        run: |
          cd release
          ls -lh
          sha256sum *.apk *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "BrickPop Nova Ultimate — Latest Offline Build"
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## 🧱 BrickPop Nova Ultimate — Offline Build ${{ env.APP_VERSION }}

            Built automatically from commit `${{ github.sha }}` on ${{ github.ref_name }}.

            ### 📱 Android
            **`BrickPop-Nova-Ultimate.apk`** — signed release APK
            - 100% offline (the app does not even request the INTERNET permission)
            - Immersive fullscreen, portrait, screen kept awake
            - Launcher icon + splash generated from `logo-master.png`
            - Installs over older builds and keeps your saved progress

            **Install:** download on your phone → open it → allow "Install unknown apps" for your browser/file manager → Install.

            ### 💻 Windows
            **`BrickPop-Nova-Ultimate-Portable.exe`** — single portable file
            - No installation, no admin rights — just double-click
            - Starts fullscreen (F11 toggles fullscreen)
            - Saves are stored in `BrickPop-Nova-SaveData` next to the EXE
            - Works with no internet connection at all

            `SHA256SUMS.txt` is included so you can verify the downloads.

            ---
            *Copyright © 2026 Yasin Ullah — Bannu Software Solutions · Dedicated to little Muhib Ullah ❤️*
          files: |
            release/BrickPop-Nova-Ultimate.apk
            release/BrickPop-Nova-Ultimate-Portable.exe
            release/SHA256SUMS.txt

      - name: Release summary
        run: |
          echo "### 🚀 Release published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: \`latest-build\` · Version: \`$APP_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
